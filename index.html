<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="utf-8">
     <title>class keys</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="ie=edge">
     <link rel="stylesheet" href="styles.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">


</head>
   <body>
       <main>
            <header>
                <div id="inner">
                    <img src="assets/ClassKeys 1.webp" alt="Class Keys logo" width="300" height="95.3" id="logo">
                    <div class="col">
                        <div class="row">
                            <p>lightmode</p>
                            <label class="switch">
                                <input type="checkbox" id="lightmode">
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <div class="row">
                            <p>sort by</p>
                            <select id="sort">
                                <option value="name">name</option>
                                <option value="rand" selected>random</option>
                                <option value="legacy">old system</option>
                            </select>
                        </div>
                        <div class="row">
                            <button id="showOhide">show filters</button>
                            <p id="count">games</p>
                        </div>
                    </div>
                </div>
                <div id="filters" class="hide">
                    <div class="row">
                        <p>singleplayer</p>
                        <label class="switch">
                            <input type="checkbox" id="sing" checked>
                            <span class="slider round"></span>
                        </label>
                        <p>multiplayer</p>
                        <label class="switch">
                            <input type="checkbox" id="multi" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
    
                    <div class="col">
                        <div class="row">
                            <img src="assets/Windows.svg.png" alt="windows icon" width="20" height="20">
                            <label class="switch">
                                <input type="checkbox" id="wind" checked>
                                <span class="slider round"></span>
                            </label>
                            <img src="assets/Apple_white.svg.png" alt="apple icon" width="20" height="20">
                            <label class="switch">
                                <input type="checkbox" id="aple" checked>
                                <span class="slider round"></span>
                            </label>
                            <img src="assets/linux-white-logo.png" alt="linux icon" width="20" height="20">
                            <label class="switch">
                                <input type="checkbox" id="linx" checked>
                                <span class="slider round"></span>
                            </label>
                        </div>
                    </div>
                    <div class="row">
                        <p>search</p>
                        <input type="text" id="search">
                    </div>
                </div>
            </header>
            <div id="angle"></div>

            <section id="content">

            </section>
            
            <div id="foot">
                <div id="Bangle">
                    <footer></footer>
                </div>
            </div>

       </main>
   <script src="fetch.js"></script>
   </body>
